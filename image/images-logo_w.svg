<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0052ff" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Outer Glow Hexagon -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="url(#logoGrad)" stroke-width="4" filter="url(#logoGlow)" />
  <!-- Inner Connected Hexagon Nodes -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="rgba(0, 82, 255, 0.15)" stroke="#ffffff" stroke-width="2.5" />
  <!-- Center Crypto Core -->
  <circle cx="50" cy="50" r="14" fill="url(#logoGrad)" />
  <circle cx="50" cy="50" r="8" fill="#ffffff" />
  <!-- Radiating Connection Lines -->
  <line x1="50" y1="18" x2="50" y2="36" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
  <line x1="78" y1="66" x2="62" y2="58" stroke="#4facfe" stroke-width="3" stroke-linecap="round" />
  <line x1="22" y1="66" x2="38" y2="58" stroke="#4facfe" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="18" r="4" fill="#ffffff" />
  <circle cx="78" cy="34" r="4" fill="#00f2fe" />
  <circle cx="78" cy="66" r="4" fill="#ffffff" />
  <circle cx="50" cy="82" r="4" fill="#00f2fe" />
  <circle cx="22" cy="66" r="4" fill="#ffffff" />
  <circle cx="22" cy="34" r="4" fill="#00f2fe" />
</svg>